<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dyqani — Cardeals.al</title>
<link rel="icon" type="image/png" href="https://tori-webpage.github.io/cardeals/cardeals-icon.png" />
<link rel="apple-touch-icon" href="https://tori-webpage.github.io/cardeals/cardeals-icon.png" />
<meta name="description" content="Shiko të gjitha pjesët e këtij shitësi në Cardeals.al" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<!-- Shared scripts — order matters -->
<script src="js/firebase.js"></script>
<script src="js/app.js"></script>
<script src="js/error-handler.js"></script>

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav style="background:var(--navy);border-bottom:1px solid rgba(255,255,255,0.1);">
  <a class="logo" href="index.html" style="color:white;">Car<span>deals</span>.al</a>
  <div class="nav-right">
    <button class="btn btn-ghost" onclick="openCart()" style="color:white;">🛒 <span id="cartBadge" style="background:var(--primary);color:white;font-size:0.6rem;padding:2px 6px;border-radius:10px;margin-left:2px;display:none;">0</span></button>
  </div>
</nav>

<div class="container-store" id="content">
  <a href="index.html" style="display:inline-block;color:var(--primary);text-decoration:none;margin-bottom:1.5rem;font-weight:600;">← Kthehu te Cardeals.al</a>
  <div class="spinner"></div>
</div>

<!-- Cart Modal -->
<div class="modal-overlay" id="cartModal"><div class="modal"><button class="modal-close" onclick="closeModal('cartModal')">✕</button><h3>Shporta</h3><div id="cartContent"><div style="text-align:center;padding:3rem;color:var(--text-muted);">Shporta është bosh</div></div><div id="cartCheckoutSection" style="display:none;margin-top:1rem;border-top:1px solid var(--border);padding-top:1rem;"><div style="display:flex;justify-content:space-between;font-weight:600;font-size:1rem;margin-bottom:0.5rem;"><span>Nëntotali</span><span id="cartSubtotal" style="color:var(--success);">0 L</span></div><div style="display:flex;justify-content:space-between;font-size:0.85rem;color:var(--text-muted);margin-bottom:0.5rem;"><span>Transporti</span><span id="cartShipping">0 L</span></div><div style="display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem;margin-bottom:1rem;border-top:1px solid var(--border);padding-top:0.5rem;"><span>Totali</span><span id="cartGrandTotal" style="color:var(--success);">0 L</span></div><button class="buy-btn" onclick="proceedToAddress()">VAZHDONI ME POROSINË</button></div></div></div>

<!-- Address Modal -->
<div class="modal-overlay" id="addressModal"><div class="modal"><button class="modal-close" onclick="closeModal('addressModal')">✕</button><h3>Adresa e Dorëzimit</h3><div id="addressForm"><div class="field"><label>Adresa e plotë *</label><input type="text" id="deliveryAddress" placeholder="Rruga, ndërtesa, apartamenti" /></div><div class="field"><label>Qyteti *</label><input type="text" id="deliveryCity" placeholder="p.sh. Tiranë" /></div><div class="field"><label>Kodi Postar</label><input type="text" id="deliveryPostal" placeholder="Opsionale" /></div><div class="field"><label>Udhëzime për dërgesë</label><textarea id="deliveryInstructions" rows="2" placeholder="Porta, kati, afër xhamisë..."></textarea></div><div class="field"><label>Email për konfirmim *</label><input type="email" id="deliveryEmail" /></div><button class="buy-btn" id="confirmAddressBtn" onclick="confirmAddress()">KONFIRMO POROSINË</button></div></div></div>

<div class="toast" id="toast"></div>

<!-- Page-specific script — always last -->
<script src="js/dyqani.js"></script>
</body>
</html>
