<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dyqani — Cardeals.al</title>
<link rel="icon" type="image/png" href="https://tori-webpage.github.io/cardeals/cardeals-icon.png" />
<link rel="apple-touch-icon" href="https://tori-webpage.github.io/cardeals/cardeals-icon.png" />
<meta name="description" content="Shiko të gjitha pjesët e këtij shitësi në Cardeals.al" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/app.js"></script>
<script src="js/error-handler.js"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav style="background:var(--navy);border-bottom:1px solid rgba(255,255,255,0.1);">
  <a class="logo" href="index.html" style="color:white;">Car<span>deals</span>.al</a>
  <div class="nav-right">
    <button class="btn btn-ghost" onclick="openCart()" style="color:white;">🛒 <span id="cartBadge" style="background:var(--primary);color:white;font-size:0.6rem;padding:2px 6px;border-radius:10px;margin-left:2px;display:none;">0</span></button>
  </div>
</nav>

<div class="container-store" id="content">
  <a href="index.html" style="display:inline-block;color:var(--primary);text-decoration:none;margin-bottom:1.5rem;font-weight:600;">← Kthehu te Cardeals.al</a>
  <div class="spinner"></div>
</div>

<div class="modal-overlay" id="cartModal"><div class="modal"><button class="modal-close" onclick="closeModal('cartModal')">✕</button><h3>Shporta</h3><div id="cartContent"><div style="text-align:center;padding:3rem;color:var(--text-muted);">Shporta është bosh</div></div><div id="cartCheckoutSection" style="display:none;margin-top:1rem;border-top:1px solid var(--border);padding-top:1rem;"><div style="display:flex;justify-content:space-between;font-weight:600;font-size:1rem;margin-bottom:0.5rem;"><span>Nëntotali</span><span id="cartSubtotal" style="color:var(--success);">0 L</span></div><div style="display:flex;justify-content:space-between;font-size:0.85rem;color:var(--text-muted);margin-bottom:0.5rem;"><span>Transporti</span><span id="cartShipping">0 L</span></div><div style="display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem;margin-bottom:1rem;border-top:1px solid var(--border);padding-top:0.5rem;"><span>Totali</span><span id="cartGrandTotal" style="color:var(--success);">0 L</span></div><button class="buy-btn" onclick="proceedToAddress()">VAZHDONI ME POROSINË</button></div></div></div>

<div class="modal-overlay" id="addressModal"><div class="modal"><button class="modal-close" onclick="closeModal('addressModal')">✕</button><h3>Adresa e Dorëzimit</h3><div id="addressForm"><div class="field"><label>Adresa e plotë *</label><input type="text" id="deliveryAddress" placeholder="Rruga, ndërtesa, apartamenti" /></div><div class="field"><label>Qyteti *</label><input type="text" id="deliveryCity" placeholder="p.sh. Tiranë" /></div><div class="field"><label>Kodi Postar</label><input type="text" id="deliveryPostal" placeholder="Opsionale" /></div><div class="field"><label>Udhëzime për dërgesë</label><textarea id="deliveryInstructions" rows="2" placeholder="Porta, kati, afër xhamisë..."></textarea></div><div class="field"><label>Email për konfirmim *</label><input type="email" id="deliveryEmail" /></div><button class="buy-btn" id="confirmAddressBtn" onclick="confirmAddress()">KONFIRMO POROSINË</button></div></div></div>

<div class="toast" id="toast"></div>

<script>
var params=new URLSearchParams(window.location.search);
var sellerId=params.get('id');
var allParts=[],cart=[],currentBuyer=null,pendingCheckoutData=null;

auth.onAuthStateChanged(function(user){currentBuyer=user;if(user)prefillBuyerFields();});
function prefillBuyerFields(){if(!currentBuyer)return;db.collection('buyers').doc(currentBuyer.uid).get().then(function(doc){if(doc.exists){var d=doc.data();if(d.address)g('deliveryAddress').value=d.address;if(d.city)g('deliveryCity').value=d.city;}});}

if(!sellerId){document.getElementById('content').innerHTML='<div class="not-found"><h2>Dyqani nuk u gjet</h2><p>Mungon ID e shitësit.</p></div>';}else{loadStore(sellerId);}

async function loadStore(sellerId){
  try{
    var bizDoc=await db.collection("businesses").doc(sellerId).get();
    if(!bizDoc.exists){document.getElementById('content').innerHTML='<div class="not-found"><h2>Dyqani nuk u gjet</h2><p>Ky shitës nuk ekziston.</p></div>';return;}
    var biz=bizDoc.data();
    var partsSnap=await db.collection("parts").where("uid","==",sellerId).where("status","==","active").orderBy("createdAt","desc").get();
    allParts=partsSnap.docs.map(function(d){return {id:d.id,...d.data()};});
    document.title=biz.businessName+' — Cardeals.al';
    var phone=(biz.whatsappPhone||biz.phone||'').replace(/\D/g,'');
    var whatsappLink=phone?'<a href="https://wa.me/'+phone+'" target="_blank">WhatsApp</a>':'';
    var avatarUrl=biz.photoURL||biz.logoURL||'';
    var avatarHTML=avatarUrl?'<img src="'+avatarUrl+'" alt="'+biz.businessName+'" />':'<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>';
    var html='<a href="index.html" style="display:inline-block;color:var(--primary);text-decoration:none;margin-bottom:1.5rem;font-weight:600;">← Kthehu te Cardeals.al</a>';
    html+='<div class="store-header"><div class="store-avatar">'+avatarHTML+'</div><div class="store-info"><div class="store-name">'+(biz.businessName||biz.name||'Dyqan')+'</div><div class="store-city">📍 '+(biz.city||'Shqipëri')+'</div><div class="store-stats"><div class="store-stat"><div class="store-stat-num">'+allParts.length+'</div><div class="store-stat-lbl">Pjesë</div></div></div><div class="store-contact">'+whatsappLink+'</div></div></div>';
    html+='<div class="filter-bar"><input type="text" id="filterSearch" placeholder="🔍 Kërko pjesë..." oninput="filterParts()" /><select id="filterCondition" onchange="filterParts()"><option value="all">Të gjitha gjendjet</option><option value="new">Vetëm të Reja</option><option value="used">Vetëm të Përdorura</option></select><select id="filterCategory" onchange="filterParts()"><option value="all">Të gjitha kategoritë</option><option value="brakes">Frena</option><option value="engine">Motor</option><option value="electrical">Elektrik</option><option value="suspension">Amortizatorë</option><option value="body">Karroceri</option><option value="ac">Klimë</option></select><span class="filter-count" id="filterCount">'+allParts.length+' pjesë</span></div>';
    html+='<div class="parts-grid" id="partsGrid"></div>';
    document.getElementById('content').innerHTML=html;
    loadCart();
    renderFilteredParts();
  }catch(e){document.getElementById('content').innerHTML='<div class="not-found"><h2>Gabim</h2><p>'+e.message+'</p></div>';}
}

function filterParts(){renderFilteredParts();}
function renderFilteredParts(){
  var search=document.getElementById('filterSearch')?.value.toLowerCase()||'';
  var condition=document.getElementById('filterCondition')?.value||'all';
  var category=document.getElementById('filterCategory')?.value||'all';
  var filtered=allParts.filter(function(p){var name=getPartName(p).toLowerCase();var fits=(p.fits||'').toLowerCase();if(search&&name.indexOf(search)===-1&&fits.indexOf(search)===-1)return false;if(condition!=='all'&&p.condition!==condition)return false;if(category!=='all'&&p.category!==category)return false;return true;});
  document.getElementById('filterCount').textContent=filtered.length+' pjesë';
  var grid=document.getElementById('partsGrid');
  if(!filtered.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--text-muted);">🔍 Nuk u gjet asnjë pjesë.</div>';return;}
  grid.innerHTML=filtered.map(function(p){var name=getPartName(p);var dp=getDiscountedPrice(p);var fin=getFinalPrice(p);return '<div class="part-card"><div class="part-card-img">'+partImageHTML(p,200,160)+'</div><div class="part-card-body"><span class="status-badge '+(p.condition==='new'?'badge-active':'badge-used')+'">'+(p.condition==='new'?'E RE':'E PËRDORUR')+'</span>'+(p.weeklyPromo?'<span class="promo-badge">PROMO</span>':'')+'<div class="part-card-name">'+name+'</div><div class="part-card-fits">🚗 '+(p.fits||'')+'</div><div class="part-card-price">'+formatPrice(fin)+'</div><button class="buy-btn" onclick="buyNow(\''+p.id+'\')">BLI TANI — '+formatPrice(fin)+'</button><button class="cart-add-btn" onclick="addToCart(\''+p.id+'\')">Shto në Shportë</button></div></div>';}).join('');}

function buyNow(partId){addToCart(partId);openCart();}

// ===== CART =====
function loadCart(){try{var saved=localStorage.getItem('cardeals_cart_dyqan');if(saved)cart=JSON.parse(saved);}catch(e){cart=[];}updateCartBadge();}
function saveCart(){localStorage.setItem('cardeals_cart_dyqan',JSON.stringify(cart));updateCartBadge();}
function updateCartBadge(){var count=cart.reduce(function(s,i){return s+(i.qty||1);},0);var b=document.getElementById('cartBadge');if(b){b.textContent=count;b.style.display=count>0?'inline-block':'none';}}
function addToCart(partId){var part=allParts.find(function(p){return p.id===partId;});if(!part)return;var existing=cart.find(function(item){return item.partId===partId;});if(existing){existing.qty=(existing.qty||1)+1;}else{var name=getPartName(part);cart.push({partId:partId,partName:name,sellerUid:part.uid||'',sellerName:part.sellerName||'',sellerCity:part.sellerCity||'',basePrice:part.basePrice||0,discount:part.discount||0,image:part.images?.[0]||'',qty:1});}saveCart();showToast('✅ Shtuar në shportë!');}
function removeFromCart(index){cart.splice(index,1);saveCart();renderCart();}
function updateCartQty(index,delta){cart[index].qty=Math.max(1,(cart[index].qty||1)+delta);saveCart();renderCart();}
function openCart(){renderCart();document.getElementById('cartModal').classList.add('open');}

function renderCart(){var container=document.getElementById('cartContent');var checkoutSection=document.getElementById('cartCheckoutSection');if(!cart.length){container.innerHTML='<div style="text-align:center;padding:3rem;color:var(--text-muted);">Shporta është bosh</div>';checkoutSection.style.display='none';return;}var subtotal=0;var html='';cart.forEach(function(item,index){var dp=item.discount>0?Math.round((item.basePrice||0)*(1-(item.discount||0)/100)):(item.basePrice||0);var fee=Math.round(dp*PLATFORM_FEE);var fin=dp+fee;var itemTotal=fin*(item.qty||1);subtotal+=itemTotal;html+='<div class="cart-item"><div class="cart-item-img">'+(item.image?'<img src="'+item.image+'" />':'🔩')+'</div><div class="cart-item-info"><div class="cart-item-name">'+item.partName+'</div><div class="cart-item-seller">🏪 '+item.sellerName+' · '+item.sellerCity+'</div><div class="cart-item-price">'+formatPrice(itemTotal)+'</div></div><div class="cart-item-qty"><button class="qty-btn" onclick="updateCartQty('+index+',-1)">−</button><span style="font-weight:700;font-size:0.85rem;">'+item.qty+'</span><button class="qty-btn" onclick="updateCartQty('+index+',1)">+</button></div><button class="cart-item-remove" onclick="removeFromCart('+index+')">✕</button></div>';});container.innerHTML=html;var shipping=calculateShipping(subtotal);var grandTotal=subtotal+shipping;document.getElementById('cartSubtotal').textContent=formatPrice(subtotal);document.getElementById('cartShipping').innerHTML=shipping>0?formatPrice(shipping):'<span style="color:#2e7d32;">FALAS</span>';document.getElementById('cartGrandTotal').textContent=formatPrice(grandTotal);checkoutSection.style.display='block';}

function proceedToAddress(){if(!cart.length)return;closeModal('cartModal');prefillBuyerFields();pendingCheckoutData={cartItems:cart.slice(),cartTotal:cart.reduce(function(s,i){var dp=i.discount>0?Math.round((i.basePrice||0)*(1-(i.discount||0)/100)):(i.basePrice||0);var fee=Math.round(dp*PLATFORM_FEE);return s+((dp+fee)*(i.qty||1));},0),isCartOrder:true};g('addressModal').classList.add('open');g('confirmAddressBtn').innerHTML='KONFIRMO POROSINË ('+cart.length+' pjesë)';}

async function confirmAddress(){var address=g('deliveryAddress').value.trim(),city=g('deliveryCity').value.trim(),postal=g('deliveryPostal').value.trim(),instructions=g('deliveryInstructions').value.trim(),email=g('deliveryEmail').value.trim();if(!address||!city||!email){showToast('⚠️ Plotëso adresën, qytetin dhe email-in!',true);return;}if(!pendingCheckoutData){showToast('❌ Gabim në porosi',true);return;}var btn=g('confirmAddressBtn');btn.textContent='Duke procesuar...';btn.disabled=true;var ordersToCreate=[];if(pendingCheckoutData.isCartOrder){for(var i=0;i<pendingCheckoutData.cartItems.length;i++){var item=pendingCheckoutData.cartItems[i];var dp=item.discount>0?Math.round((item.basePrice||0)*(1-(item.discount||0)/100)):(item.basePrice||0);var fee=Math.round(dp*PLATFORM_FEE);var total=(dp+fee)*(item.qty||1);ordersToCreate.push({partId:item.partId,partName:item.partName,partEmoji:'🔩',buyerName:currentBuyer?.email?.split('@')[0]||'Klient',buyerPhone:'',buyerEmail:email,sellerUid:item.sellerUid,sellerName:item.sellerName,sellerCity:item.sellerCity,basePrice:dp,quantity:item.qty||1,platformFee:fee*(item.qty||1),totalPrice:total,shippingFee:0,deliveryAddress:address,deliveryCity:city,deliveryPostal:postal,deliveryInstructions:instructions,deliveryEmail:email,payMethod:'online',status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp(),buyerUid:currentBuyer?.uid||null});}}try{var batch=db.batch();for(var j=0;j<ordersToCreate.length;j++){var order=ordersToCreate[j];var orderRef=db.collection('orders').doc();batch.set(orderRef,order);if(order.partId){var partRef=db.collection('parts').doc(order.partId);var partDoc=await partRef.get();if(partDoc.exists){var currentStock=partDoc.data().stock||0;var newStock=Math.max(0,currentStock-order.quantity);batch.update(partRef,{stock:newStock,status:newStock>0?'active':'inactive',sales:(partDoc.data().sales||0)+order.quantity});}}}await batch.commit();cart=[];saveCart();closeModal('addressModal');showToast('✅ Porosia u regjistrua!');if(currentBuyer){db.collection('buyers').doc(currentBuyer.uid).update({address:address,city:city}).catch(function(){});}showWhatsAppContact(ordersToCreate[0]);pendingCheckoutData=null;g('deliveryAddress').value='';g('deliveryCity').value='';g('deliveryPostal').value='';g('deliveryInstructions').value='';g('deliveryEmail').value='';}catch(err){showToast('❌ Gabim: '+err.message,true);}btn.textContent='KONFIRMO POROSINË';btn.disabled=false;}

function showWhatsAppContact(order){if(!order||!order.sellerUid)return;var partName=order.partName||'';db.collection("businesses").doc(order.sellerUid).get().then(function(doc){if(doc.exists){var phone=(doc.data().whatsappPhone||doc.data().phone||'').replace(/\D/g,'');if(phone){var msg=encodeURIComponent("Pershendetje! Bera nje porosi ne Cardeals.al per pjesen \""+partName+"\". Mund te koordinohemi per detajet?");showToast('📞 Kontakto shitësin në WhatsApp');setTimeout(function(){window.open('https://wa.me/'+phone+'?text='+msg,'_blank');},500);}}}).catch(function(){});}
</script>
</body>
</html>
